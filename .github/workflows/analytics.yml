name: Gold Analytics & Export

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: .
      DATABASE_PATH: data/gold_pipeline.db
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute daily OHLC (no-op after first run)
        run: python src/main.py analytics

      - name: Export and commit combined snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_DATE=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          TARGET_DATE=$TARGET_DATE python src/main.py export
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f exports/*.csv
          git diff --staged --quiet || {
            git commit -m "chore(export): snapshot for $TARGET_DATE"
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
            git push
          }
