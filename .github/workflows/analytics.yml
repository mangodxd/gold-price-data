name: Gold Analytics & Export

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: .
      DATABASE_PATH: data/gold_pipeline.db
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analytics and export CSVs
        run: python src/main.py analytics

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Export and commit hourly data snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Ho_Chi_Minh date +%H:%M)
          TARGET_DATE=$TODAY python src/main.py export
          git add -f exports/*.csv
          git diff --staged --quiet || {
            git commit -m "chore(export): hourly snapshot for $TODAY at $HOUR UTC+7"
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
            git push
          }
